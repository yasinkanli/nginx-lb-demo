x-app: &app
  build:
    context: .
    dockerfile: src/Dockerfile

services:
  app1:
    <<: *app
    environment:
      INSTANCE_NAME: app1
  app2:
    <<: *app
    environment:
      INSTANCE_NAME: app2
  app3:
    <<: *app
    environment:
      INSTANCE_NAME: app3
  app4:
    <<: *app
    environment:
      INSTANCE_NAME: app4

  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
      - app4
